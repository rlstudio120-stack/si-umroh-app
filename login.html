<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - Al Imron Travel</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <!-- Tambahkan di bawah link CSS DataTables yang sudah ada di tag <head> -->
  <link rel="stylesheet" href="https://cdn.datatables.net/buttons/2.4.1/css/buttons.bootstrap5.min.css">
</head>
<body>

  <div class="container-fluid p-0">
    <div class="row g-0 vh-100">
      <!-- Gambar Kiri -->
      <div class="col-lg-7 d-none d-lg-block position-relative" style="background-image: url('https://images.unsplash.com/photo-1565552643952-4cd84666f28b?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80'); background-size: cover; background-position: center;">
        <div class="position-absolute top-0 start-0 w-100 h-100" style="background: rgba(0, 49, 82, 0.8);"></div>
        <div class="d-flex flex-column justify-content-center h-100 px-5 position-relative z-1 text-white">
          <h1 class="display-4 fw-bold mb-3">Sistem Manajemen<br><span style="color: #FDB714;">Jemaah Al Imron</span></h1>
          <p class="lead opacity-75">Platform administrasi & keberangkatan terpadu milik PT. Enka Imron Mandiri.</p>
        </div>
      </div>
  
      <!-- Form Kanan -->
      <div class="col-lg-5 col-12 d-flex justify-content-center align-items-center bg-white shadow-lg">
        <div class="w-100 p-5" style="max-width: 480px;">
          <a href="index.html" class="btn btn-sm btn-outline-secondary mb-4 rounded-pill text-decoration-none">
            <i class="bi bi-arrow-left"></i> Kembali ke Beranda
          </a>
          
          <div class="mb-4">
            <h3 class="fw-bold text-dark">Masuk ke Sistem</h3>
            <p class="text-muted">Gunakan email dan password admin Anda.</p>
          </div>
          
          <!-- HAPUS atribut onsubmit dan onclick di sini -->
          <form id="formLogin">
            <div class="form-floating mb-3">
              <input type="email" class="form-control" id="email" placeholder="Email" required>
              <label for="email" class="text-muted">Alamat Email</label>
            </div>
            <div class="form-floating mb-4">
              <input type="password" class="form-control" id="password" placeholder="Password" required>
              <label for="password" class="text-muted">Kata Sandi</label>
            </div>
            
            <button type="button" class="btn btn-primary btn-lg w-100 fw-bold shadow-sm" id="btnLogin">
              Masuk ke Dashboard <i class="bi bi-box-arrow-in-right ms-2"></i>
            </button>
          </form>
          
          <div id="loginAlert" class="mt-4"></div>
        </div>
      </div>
    </div>
  </div>

<!-- Library Firebase (Tambahkan firestore-compat.js di sini) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  
  <!-- File JS Kita -->
  <script src="js/config/firebase.js"></script>
  <script src="js/modules/auth.js"></script>

  <!-- Script DataTables yang sudah ada -->
  <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>
  
  <!-- === TAMBAHKAN 3 SCRIPT INI UNTUK EXPORT EXCEL === -->
  <script src="https://cdn.datatables.net/buttons/2.4.1/js/dataTables.buttons.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdn.datatables.net/buttons/2.4.1/js/buttons.html5.min.js"></script>

</body>
</html>
